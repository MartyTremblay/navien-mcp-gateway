<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Governed AI access to a home boiler: architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#33475b"/>
    </marker>
    <marker id="arrowGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a97a6"/>
    </marker>
    <style>
      .zone-label { font-size: 22px; font-weight: 700; fill: #1f2933; }
      .zone-sub { font-size: 17px; fill: #52606d; }
      .box { fill: #ffffff; stroke: #33475b; stroke-width: 2; }
      .box-key { fill: #fff7e6; stroke: #b7791f; stroke-width: 2.5; }
      .title { font-size: 21px; font-weight: 700; fill: #1f2933; }
      .sub { font-size: 16px; fill: #52606d; }
      .flow { stroke: #33475b; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .flow-grey { stroke: #8a97a6; stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; marker-end: url(#arrowGrey); }
      .flow-label { font-size: 15px; fill: #33475b; }
      .flow-label-grey { font-size: 15px; fill: #6b7785; font-style: italic; }
    </style>
  </defs>

  <rect width="1400" height="860" fill="#ffffff"/>

  <!-- Household network -->
  <rect x="30" y="30" width="520" height="800" rx="18" fill="#eef4fb" stroke="#9db8d9" stroke-width="2"/>
  <text x="55" y="70" class="zone-label">Household network</text>
  <text x="55" y="96" class="zone-sub">Everyday devices, unchanged</text>

  <!-- Lab VLAN -->
  <rect x="850" y="30" width="520" height="800" rx="18" fill="#eef7ee" stroke="#8dbf8d" stroke-width="2"/>
  <text x="875" y="70" class="zone-label">Lab VLAN (Proxmox containers)</text>
  <text x="875" y="96" class="zone-sub">Separate network, separate reverse proxy</text>

  <!-- Router -->
  <rect x="610" y="330" width="180" height="150" rx="14" class="box" stroke-width="2.5"/>
  <text x="700" y="372" text-anchor="middle" class="title">Router</text>
  <text x="700" y="398" text-anchor="middle" class="sub">(UniFi)</text>
  <text x="700" y="430" text-anchor="middle" class="sub">Allow list only;</text>
  <text x="700" y="452" text-anchor="middle" class="sub">everything else blocked</text>

  <!-- Household boxes -->
  <rect x="70" y="130" width="440" height="100" rx="12" class="box"/>
  <text x="95" y="170" class="title">AI agent</text>
  <text x="95" y="198" class="sub">Claude Code, signed in on the owner's behalf</text>

  <rect x="70" y="260" width="440" height="90" rx="12" class="box"/>
  <text x="95" y="298" class="title">Owner's browser</text>
  <text x="95" y="324" class="sub">Signs in, approves each agent's scopes</text>

  <rect x="70" y="420" width="440" height="90" rx="12" class="box"/>
  <text x="95" y="458" class="title">Home Assistant</text>
  <text x="95" y="484" class="sub">Existing direct connection, unchanged</text>

  <rect x="70" y="590" width="440" height="100" rx="12" class="box-key"/>
  <text x="95" y="630" class="title">Boiler controller</text>
  <text x="95" y="658" class="sub">ESP32 + ESPHome, encrypted native API</text>

  <rect x="70" y="740" width="440" height="66" rx="12" class="box"/>
  <text x="95" y="780" class="title">Navien boiler</text>

  <!-- Lab boxes -->
  <rect x="890" y="130" width="440" height="100" rx="12" class="box"/>
  <text x="915" y="170" class="title">Reverse proxy</text>
  <text x="915" y="198" class="sub">Zoraxy, TLS with a Let's Encrypt certificate</text>

  <rect x="890" y="300" width="440" height="110" rx="12" class="box-key"/>
  <text x="915" y="340" class="title">MCP gateway</text>
  <text x="915" y="368" class="sub">Python, official MCP SDK; holds the device key;</text>
  <text x="915" y="392" class="sub">authenticates, authorizes per tool, audits</text>

  <rect x="890" y="520" width="210" height="140" rx="12" class="box"/>
  <text x="910" y="558" class="title">Keycloak</text>
  <text x="910" y="586" class="sub">Identity provider:</text>
  <text x="910" y="608" class="sub">5-minute, audience-</text>
  <text x="910" y="630" class="sub">bound tokens</text>

  <rect x="1120" y="520" width="210" height="140" rx="12" class="box"/>
  <text x="1140" y="558" class="title">Audit store</text>
  <text x="1140" y="586" class="sub">Hash-chained;</text>
  <text x="1140" y="608" class="sub">written before</text>
  <text x="1140" y="630" class="sub">any action</text>

  <text x="1110" y="730" text-anchor="middle" class="zone-sub" font-weight="600">Every request: authenticated, authorized</text>
  <text x="1110" y="756" text-anchor="middle" class="zone-sub" font-weight="600">per tool, and audited, including refusals</text>

  <!-- Flows: agent to proxy (through router) -->
  <path d="M510,180 C580,180 600,350 640,355" class="flow"/>
  <path d="M760,355 C800,350 830,190 890,185" class="flow"/>
  <text x="560" y="160" class="flow-label">MCP over HTTPS</text>
  <text x="560" y="180" class="flow-label">+ bearer token</text>

  <!-- browser to proxy (sign-in) -->
  <path d="M510,305 C570,305 600,390 640,395" class="flow"/>

  <!-- proxy to gateway -->
  <path d="M1110,230 L1110,300" class="flow"/>
  <text x="1120" y="272" class="flow-label">MCP</text>

  <!-- proxy to keycloak (sign-in), routed along the left -->
  <path d="M905,230 C850,290 850,560 890,590" class="flow"/>

  <!-- gateway to keycloak: signing keys -->
  <path d="M995,410 L995,520" class="flow"/>
  <text x="1005" y="470" class="flow-label">signing keys</text>

  <!-- gateway to audit -->
  <path d="M1225,410 L1225,520" class="flow"/>
  <text x="1235" y="470" class="flow-label">every decision</text>

  <!-- gateway to controller via router: one rule -->
  <path d="M890,395 C850,420 815,440 790,450" class="flow"/>
  <path d="M610,460 C560,520 540,600 510,630" class="flow"/>
  <text x="560" y="560" class="flow-label">one rule: gateway</text>
  <text x="560" y="580" class="flow-label">to device API only</text>

  <!-- Home Assistant to controller -->
  <path d="M290,510 L290,590" class="flow-grey"/>
  <text x="300" y="556" class="flow-label-grey">its own path</text>

  <!-- controller to boiler -->
  <path d="M290,690 L290,740" class="flow"/>
  <text x="300" y="722" class="flow-label">NaviLink RS485</text>
</svg>
