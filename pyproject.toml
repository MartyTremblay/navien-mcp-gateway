[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "boiler-gateway"
version = "0.1.0"
description = "A governed MCP gateway in front of an ESPHome-controlled boiler"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Direct dependencies are pinned; upgrades are deliberate (ADR 0002).
dependencies = [
    "mcp==2.3.0",
    "aioesphomeapi==46.9.0",
    "pyjwt[crypto]==2.15.1",
    "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
